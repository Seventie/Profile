<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Resume PDF viewer and download." />
    <title>Resume</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>Resume</h1>
      <a class="download" href="resume.pdf" download>Download PDF</a>
    </header>

    <main>
      <object class="pdf-viewer" data="resume.pdf#toolbar=0" type="application/pdf">
        <div class="fallback">
          <p>Your browser cannot display the PDF preview.</p>
          <a href="resume.pdf" download>Download the resume</a>
        </div>
      </object>
    </main>
  </body>
</html>
